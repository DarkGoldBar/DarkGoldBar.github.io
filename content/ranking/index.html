<div id="ranking"></div>

<script>
const API_URL = "https://o3cx4bmlod.execute-api.ap-northeast-1.amazonaws.com/Prod/";
const siteOrigin = "https://darkgoldbar.github.io"; // Fill in the origin to report, for example: https://example.com

window.addEventListener("load", function () {
    if (!siteOrigin) {
        ranking_message("Please configure siteOrigin before loading visit data.");
        return;
    }
    ranking_request();
});

function ranking_request() {
    const url = new URL("visits", API_URL);
    url.searchParams.set("origin", siteOrigin);

    fetch(url)
        .then(function (response) {
            if (!response.ok) {
                throw new Error("Request failed with status " + response.status);
            }
            return response.json();
        })
        .then(function (data) {
            ranking_render(data.visits || []);
        })
        .catch(function () {
            ranking_message("Unable to load visit data.");
        });
}

function ranking_render(visits) {
    const ranking = document.getElementById("ranking");
    ranking.replaceChildren();

    if (visits.length === 0) {
        ranking_message("No visit data found.");
        return;
    }

    visits.sort(function (first, second) {
        return second.visit_count - first.visit_count;
    });

    const table = document.createElement("table");
    table.setAttribute("class", "table table-striped table-bordered table-hover");
    const thead = document.createElement("thead");
    const tr = document.createElement("tr");
    const th1 = document.createElement("th");
    const th2 = document.createElement("th");
    th1.setAttribute("scope", "col");
    th2.setAttribute("scope", "col");
    th1.textContent = "Visits";
    th2.textContent = "Page";
    tr.appendChild(th1);
    tr.appendChild(th2);
    thead.appendChild(tr);
    table.appendChild(thead);
    const tbody = document.createElement("tbody");
    for (let i = 0; i < visits.length; i++) {
        const tr = document.createElement("tr");
        const td1 = document.createElement("td");
        const td2 = document.createElement("td");
        td1.textContent = visits[i].visit_count;
        td2.textContent = visits[i].page_url;
        tr.appendChild(td1);
        tr.appendChild(td2);
        tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    ranking.appendChild(table);
}

function ranking_message(message) {
    const ranking = document.getElementById("ranking");
    ranking.replaceChildren();
    const paragraph = document.createElement("p");
    paragraph.textContent = message;
    ranking.appendChild(paragraph);
}
</script>
